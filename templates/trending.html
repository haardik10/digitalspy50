<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DigitalSpy | Trending News</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --text: #e5f0ff;
            --muted: #8aa0bd;
            --primary: #22d3ee;
            --secondary: #7c3aed;
            --success: #22c55e;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --card-border: rgba(255, 255, 255, 0.08);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.22);
            --radius-xl: 24px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 20%, rgba(34, 211, 238, 0.10), transparent 24%),
                radial-gradient(circle at 85% 15%, rgba(124, 58, 237, 0.12), transparent 24%),
                linear-gradient(180deg, #040b16 0%, #07111f 42%, #091626 100%);
            min-height: 100vh;
        }

        .topbar {
            background: rgba(5, 12, 24, 0.88);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .topbar-inner,
        .page-wrap {
            width: min(1240px, 94%);
            margin: 0 auto;
        }

        .topbar-inner {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            padding: 12px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: var(--text);
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.3rem;
            background: linear-gradient(135deg, rgba(34, 211, 238, 0.20), rgba(124, 58, 237, 0.22));
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .brand-text h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .brand-text p {
            margin: 6px 0 0;
            font-size: 0.88rem;
            color: var(--muted);
        }

        .top-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .link-btn,
        .primary-btn {
            border: none;
            outline: none;
            cursor: pointer;
            text-decoration: none;
            font-weight: 700;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 18px;
        }

        .link-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text);
            border: 1px solid rgba(255,255,255,0.08);
        }

        .primary-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #f8fbff;
        }

        .page-wrap {
            padding: 28px 0;
        }

        .hero-card,
        .results-card {
            background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.025));
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow-md);
            border-radius: var(--radius-xl);
            padding: 26px;
            margin-bottom: 22px;
        }

        .hero-card h2,
        .results-card h3 {
            margin: 0 0 14px;
            font-weight: 900;
        }

        .hero-card p,
        .empty-state,
        .article-meta {
            color: var(--muted);
            line-height: 1.8;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 18px;
            margin-top: 18px;
        }

        .article-card {
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 18px;
            background: linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.03));
            overflow-wrap: anywhere;
        }

        .article-image {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 14px;
            display: block;
            background: rgba(255,255,255,0.04);
        }

        .article-card h4 {
            margin: 0 0 12px;
            font-size: 1.05rem;
            line-height: 1.5;
            font-weight: 800;
        }

        .article-link {
            color: #b8f6ff;
            text-decoration: none;
            font-weight: 700;
        }

        .article-link:hover {
            text-decoration: underline;
        }

        

        
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 10px 14px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.86rem;
            border: 1px solid rgba(255,255,255,0.10);
            background: rgba(255,255,255,0.05);
            margin-bottom: 16px;
        }

        .status-warning {
            background: rgba(245, 158, 11, 0.12);
            color: #ffe1a8;
        }

        .status-danger {
            background: rgba(244, 63, 94, 0.12);
            color: #ffc4d0;
        }

        .status-neutral {
            background: rgba(148, 163, 184, 0.12);
            color: #d2dced;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/" class="brand">
                <div class="brand-logo">🕵️</div>
                <div class="brand-text">
                    <h1>DigitalSpy</h1>
                    <p>Advanced verification intelligence for news workflows</p>
                </div>
            </a>

            <div class="top-actions">
                <a href="/" class="link-btn">Home</a>
                <a href="/trending" class="link-btn">Trending News</a>
                <a href="/about" class="link-btn">About Us</a>
            </div>
        </div>
    </header>

    <main class="page-wrap">
        <section class="hero-card">
            <h2>Trending Articles</h2>
            <p>Click below to fetch the latest articles with source, image and summary</p>
            <button id="fetchTrendingBtn" class="primary-btn" type="button">Load Trending News</button>
        </section>

        <section class="results-card">
            <h3>Trending Feed</h3>
            <div id="trendingResults">
                <div class="status-badge status-neutral">Waiting for action</div>
                <p class="empty-state">Click Load Trending News to fetch the latest article stream.</p>
            </div>
        </section>
    </main>

    <script>
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }


        async function loadTrendingNews() {
            const btn = document.getElementById("fetchTrendingBtn");
            const container = document.getElementById("trendingResults");

            btn.disabled = true;
            btn.textContent = "Loading...";

            try {
                const res = await fetch("/api/trending-news");

                if (!res.ok) {
                    throw new Error(`HTTP error: ${res.status}`);
                }

                const data = await res.json();

                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = `
                        <div class="status-badge status-warning">No articles found</div>
                        <p class="empty-state">The backend returned an empty result.</p>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="articles-grid">
                        ${data.map(article => {
                            
                            const color = article.color || "gray";
                            
                            const source = article.source && article.source.trim() !== ""
                                ? article.source
                                : "Unknown Source";

                            return `
                                <div class="article-card">
                                    ${article.image ? `
                                        <img
                                            class="article-image"
                                            src="${escapeHtml(article.image)}"
                                            alt="${escapeHtml(article.title || "Untitled Article")}"
                                            loading="lazy"
                                            onerror="this.style.display='none';"
                                        >
                                    ` : ""}

                                    <h4>${escapeHtml(article.title || "Untitled Article")}</h4>

                                    <div class="article-meta">
                                        Source: <strong>${escapeHtml(source)}</strong>
                                    </div>

                                    <a
                                        class="article-link"
                                        href="${escapeHtml(article.url || "#")}"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                    >
                                        Read source
                                    </a>

                                    

                                    ${article.summary ? `
                                        <div class="article-meta" style="margin-top: 12px;">
                                            ${escapeHtml(article.summary)}
                                        </div>
                                    ` : ""}
                                </div>
                            `;
                        }).join("")}
                    </div>
                `;
            } catch (error) {
                console.error("Trending news fetch error:", error);
                container.innerHTML = `
                    <div class="status-badge status-danger">Error</div>
                    <p class="empty-state">${escapeHtml(error.message)}</p>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = "Load Trending News";
            }
        }

        document.getElementById("fetchTrendingBtn").addEventListener("click", loadTrendingNews);
    </script>
</body>
</html>
